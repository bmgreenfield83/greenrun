[project]
name = "greenrun-backend"
version = "0.1.0"
description = "FastAPI backend for the Greenrun application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "garmin-fit-sdk>=21.205,<22.0",
  "pydantic-settings>=2.10,<3.0",
  "pymongo>=4.13,<5.0",
  "python-dotenv>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
