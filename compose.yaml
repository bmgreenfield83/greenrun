services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - running-tracker-mongo:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: running_tracker
      FRONTEND_ORIGIN: http://localhost:5173
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
    volumes:
      - running-tracker-garmin:/data/garmin
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  running-tracker-mongo:
  running-tracker-garmin:
